<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment here</title>
    <style>
        .website {
            display: grid;

            grid-template-columns: 250px 1fr;

            grid-template-rows: 80px 2fr 60px;

            min-height: 100vh;
        }

        header {
            grid-column: 1 / 3;
            background: rgb(211, 62, 13);
        }

        aside {
            background: rgb(137, 140, 228);
        }

        main {
            background: rgb(204, 235, 208);
        }

        footer {
            grid-column: 1/3;
            background: rgb(3, 139, 170);
        }
    </style>
</head>
<!-- ! CSS GRID PLAYGROUND -->

<body>

    <div class="website">

        <header>
            Header
        </header>

        <aside>
            Sidebar
        </aside>

        <main>
            Main Content
        </main>

        <footer>
            Footer
        </footer>

    </div>

</body>

</html>
